name: Release engraved scores

on: workflow_call

jobs:
  engrave_scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix git safe.directory in container
        run: mkdir -p /home/runner/work/_temp/_github_home && printf "[safe]\n\tdirectory = /github/workspace" > /home/runner/work/_temp/_github_home/.gitconfig

      - name: Engrave
        uses: docker://ghcr.io/edition-esser-skala/ees-tools:v2026.01.0

      - name: Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final/*.pdf
            final/midi_collection.zip
          fail_on_unmatched_files: false

      - name: Publish via rsync
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzrm --delete
          path: final/
          remote_path: html/edition/assets/${{ github.event.repository.name }}/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
